name: Refresh public market research
on:
  schedule:
    # Once per weekday after the close (16:17 Taipei). Reduced on 2026-11-10 after the account review;
    # intraday prices are fetched by the website itself and do not need this job.
    - cron: '17 8 * * 1-5'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticated updater and persisted health
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
          SITE_ORIGIN: https://taiwan-momentum-lab-joey-1027.ceshixiezuo602.chatgpt.site
        shell: bash
        run: |
          set -u
          if [ -z "$CRON_KEY" ]; then echo "Missing updater secret"; exit 1; fi
          endpoint="$SITE_ORIGIN"
          status=$(curl --silent --show-error --connect-timeout 15 --max-time 180 --request POST --header "X-Cron-Key: $CRON_KEY" --output refresh.json --write-out '%{http_code}' "$endpoint/api/scheduled-refresh")
          result=$?
          if [ "$result" -eq 0 ] && [ "$status" = "200" ]; then
            printf "\nForward validation capture health:\n"
            curl --silent --show-error --connect-timeout 10 --max-time 60 --request POST --header "X-Cron-Key: $CRON_KEY" "$endpoint/api/validation/refresh"
          fi
          printf 'Updater HTTP=%s transport=%s\n' "$status" "$result"
          if [ -f refresh.json ]; then cat refresh.json; fi
          printf '\nPersisted public source health:\n'
          curl --silent --show-error --connect-timeout 10 --max-time 25 "$endpoint/api/health"
          printf '\nAn attempted run is not proof of fresh data; inspect persisted dates and source health above.\n'
          if [ "$result" -ne 0 ] || [ "$status" != "200" ]; then exit 1; fi
